[project]
name = "ev-assistant"
version = "0.1.0"
description = "EV: a fully local, voice-first desktop AI assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "mss>=9.0",
    "rapidocr-onnxruntime>=1.3",
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "pynput>=1.7",
    "pystray>=0.19",
    "pillow>=10",
    "psutil>=5.9",
    "ddgs>=9.0",
    "pycaw>=20240210",
    "comtypes>=1.4",
]

[project.optional-dependencies]
overlay = ["PySide6-Essentials>=6.7"]
wakeword = ["openwakeword>=0.6"]
kokoro = ["kokoro-onnx>=0.3"]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "hypothesis>=6.100",
    "jiwer>=3.0",
]

[tool.setuptools.packages.find]
include = ["ev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pipeline tests with mocked hardware",
    "eval: slow evaluation suites (need Ollama / models)",
    "hardware: needs real mic / speakers / display",
]
addopts = "-m 'not eval and not hardware'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"ev/evals/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
