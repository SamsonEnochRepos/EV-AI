# What Evie knows about the user. These used to be written into persona.md; they are seeded into memory (ev/memory/migrations.py)
# and the user can change any of it by voice ("forget my laptop", "remember that ...") or by editing the vault and confirming.
#
# On first start-up every key here is seeded. After that, a key you ADD here is added to your vault the next time EV starts
# (apply_seed_updates): an existing fact is never overwritten and a fact you forgot is not brought back. To change a fact that
# is already in your vault, tell Evie or edit EV/Facts.md and say "review my unconfirmed facts".
#
# Everything below comes from things the user said about themself (the original persona, and their messages to Claude about
# their projects, portfolio and preferences). Nothing is guessed. Keep each value under 200 characters: facts go in the prompt.
