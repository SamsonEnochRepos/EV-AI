# EV safety policy. Evaluated by ev/safety/policy.py on every tool call, regardless of
# what the model or any on-screen/web/file text says.

[defaults]
unknown_tool = "blocked"
max_agent_steps = 8
confirm_timeout_s = 20

# permission level per tool: safe | confirm | blocked
[tools]
get_time_date = "safe"
open_app = "safe"             # admin=true (run as administrator) always escalates to confirm; see policy.py
close_app = "safe"            # polite close only; force=true escalates to confirm, protected apps are blocked
open_website = "safe"         # public https sites only; unfamiliar links that carry a query string escalate to confirm
take_screenshot = "safe"
open_file = "safe"            # only files in [files] open_dirs, only the types in open_extensions; the tool re-checks the file it resolves itself
set_display_mode = "safe"     # toggles the on-screen text card; touches nothing but EV's own overlay
set_timer = "safe"
set_reminder = "safe"
media_control = "safe"
set_volume = "safe"
web_search = "safe"
get_weather = "safe"
read_screen = "safe"
screenshot_describe = "safe"
remember_fact = "safe"
forget_fact = "safe"          # a write to memory the user didn't plainly say (web/screen/note text, or words they never said) is escalated to a spoken yes in code: ev/safety/provenance.py
recall = "safe"               # read-only search of the vault; results are wrapped as untrusted data
run_skill = "safe"            # a skill's steps are ordinary tool calls and EACH goes through the gate on its own; a risky step still asks
save_skill = "safe"           # voice only (not in the model's tool list): turns what was just done into a skill file in skills/
manage_skill = "safe"         # voice only: add a phrase, rename, list. Deleting a skill is escalated to confirm by policy.py (from the arguments)
list_reminders = "safe"
open_dashboard = "safe"        # voice only: opens EV's own loopback page in the browser (a one-time sign-in link; see SECURITY.md)
snooze_proactive = "safe"     # voice only: makes EV quieter, never louder (it can't widen anything)
get_agenda = "safe"           # read-only calendar (an .ics file or Outlook); only registered when a calendar is configured; event titles are untrusted data
keep_fact = "confirm"         # voice only (not in the model's tool list): keep a hand-edited line of Facts.md as a fact. Always a spoken yes
take_note = "safe"
focus_window = "safe"
scroll = "safe"
copy_selection = "safe"
# Control tools are "safe" at the tool level; arg-level rules in [control] escalate to
# confirm (submit/delete-style targets, risky key combos) or block (password fields etc.).
click_element = "safe"
type_text = "safe"
press_keys = "safe"
paste = "safe"
do_on_screen = "safe"
run_shell = "blocked"
delete_file = "confirm"
move_file = "confirm"
send_message = "confirm"

[apps]
# open_app launches only these names (case-insensitive) or resolved Start-menu entries.
allowlist = [
  "notepad", "calculator", "calc", "paint", "explorer", "file explorer", "settings",
  "chrome", "google chrome", "edge", "microsoft edge", "firefox", "spotify", "vscode",
  "visual studio code", "terminal", "windows terminal", "word", "excel", "powerpoint",
  "discord", "task manager",
]
allow_start_menu_resolution = true

# Never closed by close_app, however it is asked: Windows itself, security software, and EV's own brain.
# (EV's own process and the terminal it runs in are also excluded at run time.)
protected = [
  "system", "csrss", "wininit", "winlogon", "services", "lsass", "smss", "svchost", "dwm", "fontdrvhost",
  "taskhostw", "sihost", "ctfmon", "runtimebroker", "searchhost", "startmenuexperiencehost", "shellexperiencehost",
  "textinputhost", "registry", "msmpeng", "securityhealthservice", "securityhealthsystray", "windows security",
  "windows defender", "defender", "ollama", "ollama app",
]
no_force = ["explorer", "file explorer", "taskmgr", "task manager"]   # fine to close politely, never kill

[web]
# open_website opens these (and their subdomains) without asking, besides the built-in sites (YouTube, Google, GitHub...).
# Any other address needs a spoken yes, because data can be smuggled out in a hostname or path. Add sites you use a lot.
trusted_hosts = []

[files]
safe_dirs = ["data/notes", "data/sandbox"]
deny_symlinks = true
# open_file may open a file only from these folders ({name} is filled in from ev.toml at start-up; an entry whose
# feature is off is dropped) and only these types. Opening a file can run it, so no .exe/.bat/.lnk/.ps1/.html here.
open_dirs = ["data/notes", "data/sandbox", "{screenshots}", "{vault_ev}"]
open_extensions = ["png", "jpg", "jpeg", "gif", "webp", "bmp", "pdf", "txt", "md", "csv",
                   "docx", "xlsx", "pptx", "mp3", "wav", "mp4"]
# Where EV's own code may create files. The vault (ev/memory/vault.py) refuses to write anywhere else, so a bug there can't
# reach the rest of the user's vault. Everything in the vault outside the EV folder is read-only to EV.
write_dirs = ["{vault_ev}", "{skills}", "data/notes"]

[shell]
enabled = false
allowlist = []

[control]
# window titles / control names that mean "this is sensitive": typing/clicking is blocked.
blocked_control_patterns = ["password", "passcode", "pin code", "cvv", "credit card", "card number"]
blocked_window_patterns = ["registry editor", "regedit", "windows security", "uac", "credential"]
blocked_key_combos = ["win+r", "ctrl+alt+delete", "alt+f4"]
confirm_key_combos = ["enter", "ctrl+w", "ctrl+shift+delete", "delete"]
typing_max_chars = 500
# clicking a control whose name matches any of these requires spoken confirmation
confirm_control_patterns = [
  "send", "submit", "delete", "remove", "buy", "purchase", "pay", "place order", "checkout",
  "install", "uninstall", "sign out", "log out", "empty recycle", "don't save", "discard",
  "transfer", "confirm", "post", "publish", "unsubscribe", "administrator", "run as",
]

[confirm_patterns]
# Anything that smells like administrator rights needs a spoken yes first, whatever the tool or who suggested it.
# EV never elevates by itself: an approved "as administrator" launch still goes through Windows' own UAC prompt.
tools = ["open_app", "open_website", "close_app", "click_element", "focus_window", "do_on_screen"]
args = ['\badmin(istrator|istrative)?\b', '\brun ?as\b', '\belevat(e|ed|ion)\b', '\bsudo\b', '\bsuper ?user\b', '\broot access\b']

[blocked_patterns]
# regexes matched against any string argument of any tool (case-insensitive)
args = [
  '\bformat\s+[a-z]:', '\bdiskpart\b', '\breg(edit)?\b\s+(add|delete|import)',
  'HKEY_', 'Login Data', 'logins\.json', 'Credential(s| Manager)', 'cookies\.sqlite',
  '\bnet\s+user\b', 'Set-MpPreference', 'DisableRealtimeMonitoring', 'Invoke-Expression',
  'powershell\s+-enc', 'curl[^|]*\|\s*(sh|bash|iex)', '\.\.[\\/]',
]

[injection]
# heuristic phrases that mark instruction-like content inside untrusted data
phrases = [
  'ignore (all |any )?(previous|prior|above) (instructions|prompts)',
  'disregard (the )?(previous|above|system)', 'you are now', 'new instructions',
  'system prompt', 'do not tell the user', 'delete (all|the|my) ', 'send (my|the) (files|passwords)',
  'execute the following', 'run the following command', 'as an ai language model',
  'pre-?approved', 'the user has (already )?(confirmed|approved|authorized)',
  'note to (the )?(ai|assistant|model)', 'always trust', '\b(remember_fact|forget_fact|delete_file|run_shell|send_message|type_text|press_keys|close_app|open_website)\b',
  'press win\+r', 'type your (saved )?passwords?',
]
