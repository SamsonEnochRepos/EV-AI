# EV configuration. Every tunable lives here; no magic numbers in code.

[general]
persona_file = "config/persona.md"
policy_file = "config/policy.toml"
data_dir = "data"              # SQLite DB, profile, reminders (relative to repo root)
log_dir = "logs"
log_conversations = true       # false disables conversation logging entirely
max_tool_steps = 5             # LLM tool-call loop cap per turn

[hotkeys]
push_to_talk = "ctrl+alt+space"
kill_switch = "ctrl+alt+shift+k"   # not Task Manager's Ctrl+Shift+Esc
confirm_yes = "ctrl+alt+y"
confirm_no = "ctrl+alt+n"

[trigger]
mode = "wakeword"              # "hotkey" | "wakeword" (the push-to-talk hotkey always works too)
wakeword_model = "hey_evie"  # trained model in models/openwakeword/ (see scripts/wakeword/), or "hey_jarvis", or a path to any .onnx
wakeword_dir = "models/openwakeword"   # fetch once: python scripts/download_models.py --wakeword hey_jarvis
wakeword_threshold = 0.5

[conversation]
followup_enabled = true        # keep listening after EV answers, no wake word / hotkey needed
followup_window_s = 7          # how long to wait for the user to keep talking
followup_question_window_s = 12   # longer window when EV's reply ended with a question
followup_max_turns = 8         # safety cap on back-to-back turns per activation
followup_patience_s = 2        # every back-to-back turn adds this much to the listening window (people answer slower mid-conversation)
followup_window_max_s = 15     # ...but never more than this
continuous_mic = false         # true = keep one mic stream open for the whole conversation (no re-open between turns, nothing lost at the hand-off between EV speaking and you answering). Off until tried on your mic and speakers
turn_gap_ms = 300              # pause between EV finishing and the mic reopening, so the speaker tail isn't heard as you
voice_interrupt = true         # talk over EV while it speaks and it stops and listens
interrupt_min_ms = 300         # how long you must keep talking before EV stops (higher = fewer false stops)
interrupt_margin = 1.5         # how much louder than EV's own echo (predicted from what was playing ~0.5 s ago) you must be; raise if EV still cuts itself off, e.g. on loud speakers
interrupt_floor = 0.015        # absolute minimum mic level (0..1) that can count as you talking

[audio]
sample_rate = 16000
block_ms = 30
input_device = ""              # "" = system default
output_device = ""
vad_aggressiveness_threshold = 0.5
silence_ms_to_end = 550            # tuned from 700: shorter wait before EV acts; typical mid-sentence pauses are under 400 ms
max_utterance_s = 15
min_utterance_ms = 250
pre_roll_ms = 480                  # audio kept from before the VAD fired; 300 risked clipping soft first words

[stt]
model = "distil-small.en"       # English-only, small-class accuracy for real/accented speech; see DECISIONS D17. "base" is the faster, less accurate option (about 1.3 s quicker per turn here)
compute_type = "int8"
device = "cpu"
cpu_threads = 6
language = "en"
beam_size = 3
hotwords = ["Evie", "EV", "Sam", "Spotify", "Firefox", "Chrome", "Discord", "Notepad", "Ollama", "VS Code", "YouTube", "display mode"]   # biases decoding toward words EV hears often

[tts]
engine = "piper"               # "piper" | "kokoro"; piper (hfc_female) is the main voice, kokoro is the optional more natural one
piper_voice = "en_US-hfc_female-medium"
piper_voice_dir = "models/piper"
length_scale = 1.0
kokoro_voice = "af_heart"
kokoro_dir = "models/kokoro"
kokoro_speed = 1.05            # a touch brisker than default sounds more conversational
first_chunk_min_chars = 12
first_clause_chars = 0         # >0: speak a long opening sentence from its first comma once it is this long. Off: first speech already starts ~0.25 s after the question here, so it only costs prosody
sentence_pause_ms = 90         # short breath between sentences so replies don't run together

[llm]
host = "127.0.0.1"
port = 11434
model = "qwen2.5:3b"
fallback_model = "llama3.2:latest"
num_ctx = 6144                 # persona + 27 tool schemas + facts need ~3k tokens; 2048 truncated the prompt. Measured on qwen2.5:3b (D24): 4096, 6144 and 8192 all sit 100% on the GPU (2.2-2.3 GB) at ~60 tok/s with the same load time
temperature = 0.6
num_predict = 110              # replies are spoken, so they are short; the sentence cap below is the real limit
reply_max_sentences = 2        # hard cap per turn unless the user asks for detail
reply_max_sentences_detail = 6 # cap when they do ("explain in detail", "tell me a story", "walk me through")
keep_alive = "30m"
direct_tool_replies = false    # true = speak a finished tool result ("Opened Spotify.") as is and skip the second model call. Measured here: no faster (the prompt cache makes that call ~free) and less natural, so off; try it on slow hardware
filler_after_s = 1.3           # a slow tool (search, weather, screen read) gets a short "one sec" after this long; 0 = silent
filler_tools = ["web_search", "get_weather", "read_screen", "screenshot_describe"]
rewarm_after_s = 90            # if the model has been idle this long (or was unloaded for a screen read), reload it while you speak
request_timeout_s = 60
vram_budget_gb = 3.2           # the dashboard warns when a chat model larger than this is picked (this GPU has 4 GB, shared with the speech and voice models)
history_turns = 6
lookup_planner = true          # before the main call, one tiny tool-less call decides whether a question needs the web and writes the query (a 3B model won't reliably call web_search by itself). Only runs on question-shaped turns; false = leave it to the model
think = false

[vlm]
model = "qwen2.5vl:3b"             # measured 5/5 vs moondream 2/5 on UI-reading tasks; see DECISIONS D11
keep_alive = "0"               # unload immediately after use
max_image_px = 768

[screen]
max_capture_px = 1280
ocr_min_confidence = 0.5
agent_max_steps = 8
screenshot_dir = ""             # where "take a screenshot" saves PNGs; "" = Pictures\EV Screenshots

[overlay]
# The island: a small black pill at the top of the screen with two eyes that follow your mouse pointer. It opens while EV
# listens or talks, half-opens while it thinks, and in display mode grows downward to show the conversation as text.
enabled = true
toolkit = "qt"                 # "qt" | "tk"
anchor = "top-center"          # top-center|top-left|top-right|bottom-center|...
offset_x = 0
offset_y = 6
monitor = 0
width = 116                    # the island at rest
height = 34
wide_width = 236               # fully open (listening / speaking)
wide_height = 42
idle_visible = true            # false = the island appears only while EV is busy and fades away after
follow_cursor = true           # the eyes follow the mouse pointer
eye_color = "#ffffff"
accent = "#ff2d3f"             # the ring and eye colour while EV is working on your screen, or when something goes wrong
bar_count = 11
fps = 30
fade_ms = 180
display_mode = false           # start with the text on; "EV, activate display mode" / "deactivate display mode" toggles it
display_width = 460            # the island's width when it holds text
display_max_height = 300       # the island never grows taller than this; long replies scroll so the newest words show
display_font_pt = 12
display_linger_s = 8           # how long the text stays after EV finishes talking, before the island closes back up
hide_delay_ms = 600            # only when idle_visible = false
fill = "#000000"
fill_alpha = 250
border = "#2a2a2a"

[memory]
db_file = "ev.sqlite"
profile_file = "profile.json"
summary_every_turns = 8
max_facts_in_prompt = 24       # the facts seeded from config/seed_facts.toml take about 17 of these; the rest is room for facts you add
seed_file = "config/seed_facts.toml"   # facts moved out of persona.md; seeded into memory once at first start-up
fact_max_chars = 200           # a remembered fact's value is cut to this
fact_overlap_min = 0.8         # a model-made remember/forget is silent only if this share of its words are words you said in your last three utterances; otherwise EV asks first
chromadb_enabled = false

[vault]
# Memory lives in a folder of Markdown files (an Obsidian vault; Obsidian doesn't have to be running). EV writes only inside
# <path>/<ev_folder>; the rest of the vault is read-only to it. Facts.md lines are trusted only if EV itself wrote that exact line.
enabled = true
path = "~/Documents/EV-Vault"  # created on first start-up if missing
ev_folder = "EV"
index_file = "vault_index.sqlite"   # rebuildable search index (SQLite FTS5), kept in data_dir
poll_s = 15                    # how often the index looks for notes you edited
max_note_kb = 512              # bigger notes are left out of the index
recall_k = 4                   # snippets returned by recall
daily_summaries = true         # append the rolling conversation summary to EV/Daily/<date>.md (off if general.log_conversations is false)
auto_recall = false            # true = put up to auto_recall_k wrapped snippets from your notes in each request. Off: not measured with a real vault
auto_recall_k = 2

[proactive]
# EV speaking up on its own (low battery, a long build finished, the morning brief...). Rules and guards live in
# config/proactive.toml. "quiet for an hour" snoozes the spoken lines. Off here = EV only ever answers.
enabled = true
rules_file = "config/proactive.toml"
# The dashboard can tune these guards (and writes them to ev.local.toml). They only ever override the [guards] table of the rules
# file, and only within its limits. Leave them out to use the rules file's own values.
# max_spoken_per_hour = 4
# quiet_start = "22:30"
# quiet_end = "07:30"
# max_idle_s = 1800
# defer_minutes = 10

[dashboard]
# A local page for watching EV and changing how it feels: http://127.0.0.1:<port>, opened by saying "open the dashboard" or from the
# tray. Loopback only; every visit needs a one-time sign-in link EV opens for you. It cannot change policy.toml or anything that
# widens what EV can reach (see docs/SECURITY.md). Off here = no listener at all.
enabled = true
port = 0                       # 0 = pick a free port each start

[skills]
# Routines made of ordinary tool calls, one TOML file each (see skills/work_mode.toml). Every step goes through the safety gate
# on its own. "save that as <name>" turns the last few things you did into a new one; the model cannot create or change skills.
dir = "skills"                 # EV may write new skill files here (policy.toml write_dirs {skills}), nowhere else
save_window_min = 15           # "save that as ..." looks at what worked in the last this-many minutes...
save_max_steps = 6             # ...and keeps at most this many of the newest steps

[context]
# A few lines about what is going on, put beside your request (never in the system prompt, so the prompt cache is untouched).
# Only the lines your request is about are included; the app you are in always is. Window titles, file names and event titles
# are text other people control, so the block is wrapped as untrusted data. Each signal can be switched off.
enabled = true
max_chars = 450                # the whole block, before the wrapper (about 110 tokens)
foreground = true              # "Using Firefox: <page title>". A password manager, bank or other sensitive window shows the app only
calendar = true                # the next event (needs calendar_source below)
calendar_source = "none"       # "none" | "ics" (a file) | "outlook" (classic Outlook through COM). Read-only either way
calendar_file = ""             # path to an .ics file when calendar_source = "ics"
calendar_refresh_s = 300       # refreshed in the background, never while you wait
recent_files = true            # up to three file names from Downloads, Desktop and the screenshot folder, last recent_files_minutes
recent_files_minutes = 120
battery = true
git = true                     # branch and changed-file count of a repo open in the foreground editor or terminal
repos = []                     # git repo folders to watch, e.g. ["C:/Users/you/Desktop/Projects/EV_AI"]

[privacy]
persist_audio = false
persist_screenshots = false
debug_save_screenshots = false

[web]
enabled = true
max_results = 4
timeout_s = 8
retry_pause_s = 1.5            # DuckDuckGo sometimes serves a bot check; wait this long (x attempt) before retrying
cache_s = 600                  # repeat searches within this many seconds are answered from memory
weather_enabled = true         # live weather via Open-Meteo (sends only the city name); false = DuckDuckGo only
units = "metric"               # "metric" (Celsius) | "imperial" (Fahrenheit)

[tray]
enabled = true
autostart = false
